{% extends "emails/base.html" %}
{% block content %}
  <p style="margin:0 0 20px 0; font-size:15px; line-height:1.7; color:#3a2f28;">
    Hi {{ first_name }}, your order is now
    <strong style="color:#241610;">{{ status_label }}</strong>.
  </p>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px 0;">
    <tr>
      <td style="background-color:#faf5ec; border-radius:12px; padding:16px 18px; font-family:Georgia,'Times New Roman',serif;">
        <p style="margin:0 0 4px 0; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#8f6f39;">Order ID</p>
        <p style="margin:0; font-size:14px; color:#241512; word-break:break-all;">{{ order.id }}</p>
      </td>
    </tr>
  </table>

  {% if order_url %}{% include "emails/_button.html" with url=order_url label="Track my order" %}{% endif %}
{% endblock %}

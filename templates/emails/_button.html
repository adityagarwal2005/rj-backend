{% comment %}
Bulletproof-ish CTA. A padded <a> rather than a nested table: Outlook's
rendering of the latter is worse than a slightly squarer button here.
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 4px 0;">
  <tr>
    <td align="center" bgcolor="#af8a48" style="border-radius:999px;">
      <a href="{{ url }}"
         style="display:inline-block; padding:14px 32px; font-family:Georgia,'Times New Roman',serif;
                font-size:14px; letter-spacing:0.08em; text-transform:uppercase; color:#241610;
                text-decoration:none; border-radius:999px;">{{ label }}</a>
    </td>
  </tr>
</table>
